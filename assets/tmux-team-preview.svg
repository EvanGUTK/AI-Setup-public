<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="Illustrative six-pane tmux grid showing the Chief, Validator and four specialists"><rect width="1200" height="490" rx="12" fill="#09131c"/>
<rect x="18" y="17" width="1164" height="43" rx="8" fill="#1a3036"/><circle cx="43" cy="39" r="6" fill="#ff687b"/><circle cx="64" cy="39" r="6" fill="#ebb86a"/><circle cx="85" cy="39" r="6" fill="#6fe0ae"/><text x="112" y="45" font-size="17" fill="#eaf8f2" font-family="monospace">ai-setup / claude-team</text><text x="1140" y="45" text-anchor="end" font-size="15" fill="#8bd0b2" font-family="monospace">tmux · six panes</text>
<rect x="18" y="76" width="376" height="188" rx="9" fill="#10232b" stroke="#316454"/><rect x="19" y="77" width="374" height="39" rx="9" fill="#1a3036"/><text x="35" y="104" font-family="monospace" font-size="16" font-weight="700" fill="#66e6ac">01 / CHIEF</text><text x="35" y="163" font-family="monospace" font-size="15" fill="#d4e4de">$ review project plan</text><text x="35" y="194" font-family="monospace" font-size="13" fill="#92b8aa">→ waiting for approval</text><text x="35" y="241" font-family="monospace" font-size="15" fill="#6bdea9">&gt; _</text><rect x="411" y="76" width="376" height="188" rx="9" fill="#10232b" stroke="#316454"/><rect x="412" y="77" width="374" height="39" rx="9" fill="#1a3036"/><text x="428" y="104" font-family="monospace" font-size="16" font-weight="700" fill="#66e6ac">02 / VALIDATOR</text><text x="428" y="163" font-family="monospace" font-size="15" fill="#d4e4de">$ gate status</text><text x="428" y="194" font-family="monospace" font-size="13" fill="#92b8aa">→ review ready</text><text x="428" y="241" font-family="monospace" font-size="15" fill="#6bdea9">&gt; _</text><rect x="804" y="76" width="376" height="188" rx="9" fill="#10232b" stroke="#316454"/><rect x="805" y="77" width="374" height="39" rx="9" fill="#1a3036"/><text x="821" y="104" font-family="monospace" font-size="16" font-weight="700" fill="#66e6ac">03 / ARCHITECT</text><text x="821" y="163" font-family="monospace" font-size="15" fill="#d4e4de">$ inspect modules</text><text x="821" y="194" font-family="monospace" font-size="13" fill="#92b8aa">→ dependency map</text><text x="821" y="241" font-family="monospace" font-size="15" fill="#6bdea9">&gt; _</text><rect x="18" y="278" width="376" height="188" rx="9" fill="#10232b" stroke="#316454"/><rect x="19" y="279" width="374" height="39" rx="9" fill="#1a3036"/><text x="35" y="306" font-family="monospace" font-size="16" font-weight="700" fill="#66e6ac">04 / BACKEND</text><text x="35" y="365" font-family="monospace" font-size="15" fill="#d4e4de">$ run atomic tests</text><text x="35" y="396" font-family="monospace" font-size="13" fill="#92b8aa">→ tests passing</text><text x="35" y="443" font-family="monospace" font-size="15" fill="#6bdea9">&gt; _</text><rect x="411" y="278" width="376" height="188" rx="9" fill="#10232b" stroke="#316454"/><rect x="412" y="279" width="374" height="39" rx="9" fill="#1a3036"/><text x="428" y="306" font-family="monospace" font-size="16" font-weight="700" fill="#66e6ac">05 / FRONTEND</text><text x="428" y="365" font-family="monospace" font-size="15" fill="#d4e4de">$ build components</text><text x="428" y="396" font-family="monospace" font-size="13" fill="#92b8aa">→ feature in progress</text><text x="428" y="443" font-family="monospace" font-size="15" fill="#6bdea9">&gt; _</text><rect x="804" y="278" width="376" height="188" rx="9" fill="#10232b" stroke="#316454"/><rect x="805" y="279" width="374" height="39" rx="9" fill="#1a3036"/><text x="821" y="306" font-family="monospace" font-size="16" font-weight="700" fill="#66e6ac">06 / QA</text><text x="821" y="365" font-family="monospace" font-size="15" fill="#d4e4de">$ verify regression</text><text x="821" y="396" font-family="monospace" font-size="13" fill="#92b8aa">→ checking failure paths</text><text x="821" y="443" font-family="monospace" font-size="15" fill="#6bdea9">&gt; _</text>
<text x="600" y="480" text-anchor="middle" fill="#7e9892" font-family="Arial" font-size="11">DESIGN CONCEPT — NOT A CAPTURED LIVE SESSION</text></svg>